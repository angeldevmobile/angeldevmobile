<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono',ui-monospace,'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#080c16"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="338" rx="14" fill="url(#bg)" stroke="#22d3ee" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- ===== terminal top bar ===== -->
  <circle cx="30" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="24" r="6" fill="#27c93f"/>
  <text x="230" y="29" font-size="12" fill="#94a3b8" fill-opacity="0.55" letter-spacing="1">angel@dev: ~/id-card — scanning profile</text>
  <line x1="1" y1="46" x2="899" y2="46" stroke="#94a3b8" stroke-opacity="0.14"/>

  <!-- faint decorative grid (top-right) -->
  <g stroke="#94a3b8" stroke-opacity="0.06">
    <line x1="720" y1="66" x2="720" y2="150"/>
    <line x1="768" y1="66" x2="768" y2="150"/>
    <line x1="816" y1="66" x2="816" y2="150"/>
    <line x1="696" y1="94" x2="864" y2="94"/>
    <line x1="696" y1="126" x2="864" y2="126"/>
  </g>
  <text x="726" y="86" font-size="10" fill="#94a3b8" fill-opacity="0.10" letter-spacing="3">01001</text>
  <text x="726" y="146" font-size="10" fill="#94a3b8" fill-opacity="0.10" letter-spacing="3">11010</text>

  <!-- ===== left: avatar + scanning frame ===== -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" stroke-opacity="0.75">
    <path d="M72 96 V74 H94"/>
    <path d="M176 74 H198 V96"/>
    <path d="M72 178 V200 H94"/>
    <path d="M176 200 H198 V178"/>
  </g>
  <!-- avatar silhouette -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="135" cy="120" r="24"/>
    <path d="M100 188 C100 156 170 156 170 188 Z"/>
  </g>
  <text x="135" y="224" font-size="12" fill="#22d3ee" fill-opacity="0.85" text-anchor="middle" letter-spacing="2">[ SCANNING... ]</text>

  <!-- ===== right: title + fields ===== -->
  <text x="230" y="98" font-size="40" font-weight="800" letter-spacing="11" fill="#eaf2fb">ANGEL ZAPATA</text>
  <text x="233" y="126" font-size="15" letter-spacing="6" fill="#22d3ee">// DEVELOPER ID CARD</text>

  <g font-size="15">
    <text x="230" y="171" fill="#22d3ee" font-weight="600">&gt; NAME:</text>
    <text x="345" y="171" fill="#c7d2e0">Angel Zapata</text>

    <text x="230" y="203" fill="#22d3ee" font-weight="600">&gt; ROLE:</text>
    <text x="345" y="203" fill="#c7d2e0">Systems &amp; Full Stack Developer</text>

    <text x="230" y="235" fill="#22d3ee" font-weight="600">&gt; STACK:</text>
    <text x="345" y="235" fill="#c7d2e0">Rust · TypeScript · Java · Python</text>

    <text x="230" y="267" fill="#22d3ee" font-weight="600">&gt; FOCUS:</text>
    <text x="345" y="267" fill="#c7d2e0">Flux (shipped) · Orion (language in Rust)</text>

    <text x="230" y="299" fill="#22d3ee" font-weight="600">&gt; STATUS:</text>
    <circle cx="352" cy="294" r="6" fill="#34d399" filter="url(#glow)"/>
    <text x="368" y="299" fill="#34d399">ONLINE — open to collaborate</text>
  </g>
</svg>
